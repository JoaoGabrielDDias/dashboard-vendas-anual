<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login • Dashboard Vendas</title>
  <style>
    :root{
      --bg:#f6f8fc; --card:#fff; --text:#0f172a; --muted:#475569; --line:#e2e8f0;
      --shadow: 0 14px 35px rgba(2,6,23,.08);
      --accent:#2563eb; --accent2:#0ea5e9; --bad:#dc2626; --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 10% 0%, rgba(37,99,235,.12), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(14,165,233,.10), transparent 60%),
        var(--bg);
      padding:20px;
    }
    .box{
      width:100%;
      max-width:420px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:24px;
    }
    .logo{
      width:56px;height:56px;border-radius:16px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      margin-bottom:14px;
    }
    h1{margin:0;font-size:22px}
    p{margin:8px 0 0;color:var(--muted);font-size:14px}
    label{
      display:block;
      margin:16px 0 8px;
      font-size:13px;
      font-weight:800;
      color:var(--muted);
    }
    input{
      width:100%;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 14px;
      outline:none;
      font-size:14px;
    }
    button{
      width:100%;
      border:none;
      border-radius:14px;
      padding:12px 14px;
      margin-top:18px;
      color:#fff;
      font-weight:900;
      cursor:pointer;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
    }
    .msg{
      margin-top:14px;
      font-size:13px;
      color:var(--bad);
      min-height:18px;
      font-weight:700;
    }
    .footer{
      margin-top:12px;
      font-size:12px;
      color:var(--muted);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo"></div>
    <h1>Entrar no Dashboard</h1>
    <p>Use seu usuário e senha para acessar.</p>

    <form id="loginForm">
      <label>Usuário</label>
      <input id="usuario" type="text" autocomplete="username" required />

      <label>Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required />

      <button type="submit">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="footer">Acesso protegido</div>
  </div>

  <script>
    async function checkLogged() {
      try {
        const resp = await fetch('/api/auth/me', {
          headers: { 'Accept': 'application/json' }
        });
        if (resp.ok) {
          window.location.href = '/';
        }
      } catch (_) {}
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const msg = document.getElementById('msg');
      msg.textContent = '';

      const usuario = document.getElementById('usuario').value.trim();
      const senha = document.getElementById('senha').value;

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ usuario, senha })
        });

        const json = await resp.json();

        if (!resp.ok || !json.ok) {
          msg.textContent = json.message || 'Falha no login';
          return;
        }

        window.location.href = '/';
      } catch (error) {
        msg.textContent = 'Erro ao conectar no servidor';
      }
    });

    checkLogged();
  </script>
</body>
</html>
